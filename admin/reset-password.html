<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOrbit — Admin Password Recovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .admin-reset-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            z-index: 10;
        }

        .admin-reset-card {
            background: var(--surface-card, rgba(18, 24, 38, 0.88));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.12));
            border-radius: var(--radius-lg, 16px);
            padding: 36px 32px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.15);
            box-sizing: border-box;
            text-align: center;
        }

        .admin-reset-icon {
            font-size: 2.6rem;
            margin-bottom: 12px;
            display: inline-block;
        }

        .admin-reset-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .admin-reset-desc {
            font-size: 0.88rem;
            color: var(--text-muted, #94a3b8);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .pwd-req-list {
            margin: 12px 0 18px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius-sm, 8px);
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
            font-size: 0.78rem;
            text-align: left;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .pwd-req-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted, #94a3b8);
            transition: color 0.2s ease;
        }

        .pwd-req-item.valid {
            color: #4ade80;
            font-weight: 600;
        }

        .pwd-req-item.invalid {
            color: #f87171;
        }

        .pwd-req-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            display: inline-block;
            flex-shrink: 0;
        }

        .notice-card {
            padding: 16px;
            border-radius: var(--radius-md, 12px);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.88rem;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: left;
        }

        .notice-card.success {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.35);
            color: #86efac;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="cosmic-bg" aria-hidden="true"></div>

    <div class="admin-reset-wrapper">
        <div class="admin-reset-card">
            <!-- Header -->
            <div class="admin-reset-icon" id="admin-reset-icon">🛡️</div>
            <h1 class="admin-reset-title" id="admin-reset-title">Admin Password Recovery</h1>
            <p class="admin-reset-desc" id="admin-reset-desc">
                Set a secure new password for your platform administrator account.
            </p>

            <!-- Loading State -->
            <div id="recovery-loading" style="padding: 24px 0; color: var(--text-muted);">
                <div style="font-size: 1.1rem; font-weight: 600;">Verifying recovery session...</div>
            </div>

            <!-- Error Notice Box (Invalid/Expired links) -->
            <div id="recovery-notice" class="notice-card" style="display: none;"></div>

            <!-- Form -->
            <form id="admin-reset-password-form" style="display: none;">
                <div class="form-group-admin" style="text-align: left;">
                    <label for="new-password">New Admin Password</label>
                    <div class="password-input-wrap">
                        <input type="password" id="new-password" class="form-input-admin" placeholder="••••••••" autocomplete="new-password" required>
                        <button type="button" class="password-toggle-btn" id="toggle-new-password" aria-label="Show password" title="Show password">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="pwd-req-list">
                    <div class="pwd-req-item" id="req-len"><span class="pwd-req-dot"></span> 8+ Characters</div>
                    <div class="pwd-req-item" id="req-upper"><span class="pwd-req-dot"></span> Uppercase (A-Z)</div>
                    <div class="pwd-req-item" id="req-lower"><span class="pwd-req-dot"></span> Lowercase (a-z)</div>
                    <div class="pwd-req-item" id="req-num"><span class="pwd-req-dot"></span> Number (0-9)</div>
                    <div class="pwd-req-item" id="req-special" style="grid-column: span 2;"><span class="pwd-req-dot"></span> Special Symbol (!@#$%^&*)</div>
                </div>

                <div class="form-group-admin" style="text-align: left;">
                    <label for="confirm-password">Confirm New Password</label>
                    <div class="password-input-wrap">
                        <input type="password" id="confirm-password" class="form-input-admin" placeholder="••••••••" autocomplete="new-password" required>
                        <button type="button" class="password-toggle-btn" id="toggle-confirm-password" aria-label="Show password" title="Show password">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="form-error-msg" style="color: #f87171; font-size: 0.82rem; margin-bottom: 14px; text-align: left; display: none;"></div>

                <button type="submit" id="submit-reset-btn" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 6px;">
                    Update Admin Password
                </button>
            </form>

            <!-- Success State -->
            <div id="recovery-success" class="notice-card success" style="display: none;"></div>

            <!-- Back to Login Link -->
            <div style="margin-top: 20px; text-align: center;">
                <a href="index.html" class="btn-secondary" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; text-decoration: none; font-size: 0.84rem;">
                    ← Return to Admin Sign In
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        (function () {
            const form = document.getElementById('admin-reset-password-form');
            const newPassInput = document.getElementById('new-password');
            const confirmPassInput = document.getElementById('confirm-password');
            const submitBtn = document.getElementById('submit-reset-btn');
            const loadingEl = document.getElementById('recovery-loading');
            const noticeEl = document.getElementById('recovery-notice');
            const successEl = document.getElementById('recovery-success');
            const errorBox = document.getElementById('form-error-msg');
            const headerTitle = document.getElementById('admin-reset-title');
            const headerDesc = document.getElementById('admin-reset-desc');
            const headerIcon = document.getElementById('admin-reset-icon');

            let recoverySessionActive = false;
            let isSubmitting = false;

            function showNotice(title, message, icon = '⏳') {
                if (loadingEl) loadingEl.style.display = 'none';
                if (form) form.style.display = 'none';
                if (successEl) successEl.style.display = 'none';
                if (headerTitle) headerTitle.textContent = title;
                if (headerDesc) headerDesc.textContent = '';
                if (headerIcon) headerIcon.textContent = icon;
                if (noticeEl) {
                    noticeEl.innerHTML = `<strong>${title}</strong><br>${message}`;
                    noticeEl.style.display = 'block';
                }
            }

            function showForm() {
                if (loadingEl) loadingEl.style.display = 'none';
                if (noticeEl) noticeEl.style.display = 'none';
                if (successEl) successEl.style.display = 'none';
                if (form) form.style.display = 'block';
            }

            function showSuccess(html) {
                if (loadingEl) loadingEl.style.display = 'none';
                if (form) form.style.display = 'none';
                if (noticeEl) noticeEl.style.display = 'none';
                if (headerTitle) headerTitle.textContent = 'Password Updated!';
                if (headerDesc) headerDesc.textContent = 'Your administrator password has been successfully changed.';
                if (headerIcon) headerIcon.textContent = '✅';
                if (successEl) {
                    successEl.innerHTML = html;
                    successEl.style.display = 'block';
                }
            }

            function showError(msg) {
                if (errorBox) {
                    errorBox.textContent = msg;
                    errorBox.style.display = 'block';
                }
            }

            function evaluatePassword(pwd) {
                const checks = {
                    len: pwd.length >= 8,
                    upper: /[A-Z]/.test(pwd),
                    lower: /[a-z]/.test(pwd),
                    num: /[0-9]/.test(pwd),
                    special: /[^A-Za-z0-9]/.test(pwd)
                };

                const updateReq = (id, isValid) => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.className = 'pwd-req-item ' + (isValid ? 'valid' : 'invalid');
                    }
                };

                updateReq('req-len', checks.len);
                updateReq('req-upper', checks.upper);
                updateReq('req-lower', checks.lower);
                updateReq('req-num', checks.num);
                updateReq('req-special', checks.special);

                return Object.values(checks).every(Boolean);
            }

            function setupToggle(btnId, inputId) {
                const btn = document.getElementById(btnId);
                const input = document.getElementById(inputId);
                if (!btn || !input) return;

                const eyeOpenSvg = `
                    <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>`;
                const eyeSlashSvg = `
                    <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>`;

                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    btn.innerHTML = isPassword ? eyeSlashSvg : eyeOpenSvg;
                    const label = isPassword ? 'Hide password' : 'Show password';
                    btn.setAttribute('aria-label', label);
                    btn.setAttribute('title', label);
                });
            }

            setupToggle('toggle-new-password', 'new-password');
            setupToggle('toggle-confirm-password', 'confirm-password');

            if (newPassInput) {
                newPassInput.addEventListener('input', (e) => {
                    evaluatePassword(e.target.value);
                });
            }

            async function initRecovery() {
                const client = window.SupabaseConfig ? window.SupabaseConfig.getClient() : null;
                if (!client) {
                    showNotice(
                        'Configuration Error',
                        'Supabase client failed to initialize. Please verify your connection and reload the page.',
                        '❌'
                    );
                    return;
                }

                // Check URL parameters for explicit errors
                const urlParams = new URLSearchParams(window.location.search);
                const hashParams = new URLSearchParams(window.location.hash.substring(1));

                const error = urlParams.get('error') || hashParams.get('error');
                const errorCode = urlParams.get('error_code') || hashParams.get('error_code');

                if (error || errorCode) {
                    showNotice(
                        'Password Reset Link Invalid',
                        'Your password reset link is invalid or has expired. Please request a new link from the Admin Login page.',
                        '⏳'
                    );
                    return;
                }

                // Check for PKCE exchange if 'code' param is present
                const code = urlParams.get('code');
                if (code) {
                    try {
                        const { error: exchangeErr } = await client.auth.exchangeCodeForSession(code);
                        if (!exchangeErr) {
                            recoverySessionActive = true;
                            showForm();
                            return;
                        }
                    } catch (e) {
                        console.warn('PKCE exchange notice:', e);
                    }
                }

                // Listen for PASSWORD_RECOVERY or SIGNED_IN event
                const { data: { subscription } } = client.auth.onAuthStateChange(async (event, session) => {
                    if (event === 'PASSWORD_RECOVERY' || (session?.user && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION'))) {
                        recoverySessionActive = true;
                        showForm();
                    }
                });

                // Proactively check if recovery tokens are in hash
                const accessToken = hashParams.get('access_token');
                const refreshToken = hashParams.get('refresh_token');
                const tokenType = hashParams.get('type');

                if (accessToken && (tokenType === 'recovery' || !tokenType)) {
                    if (refreshToken) {
                        try {
                            const { data: sessionData, error: sessionErr } = await client.auth.setSession({
                                access_token: accessToken,
                                refresh_token: refreshToken
                            });
                            if (!sessionErr && sessionData?.session?.user) {
                                recoverySessionActive = true;
                                showForm();
                                return;
                            }
                        } catch (e) {
                            console.warn('Set recovery session caught:', e);
                        }
                    } else {
                        recoverySessionActive = true;
                        showForm();
                        return;
                    }
                }

                // Fallback session inspection
                setTimeout(async () => {
                    if (recoverySessionActive) return;

                    try {
                        const { data: sessionData } = await client.auth.getSession();
                        if (sessionData?.session?.user) {
                            recoverySessionActive = true;
                            showForm();
                            return;
                        }

                        showNotice(
                            'Reset Link Required',
                            'Please open the password reset link directly from your email to update your credentials.',
                            '✉️'
                        );
                    } catch (err) {
                        showNotice(
                            'Recovery Error',
                            'Password reset link is invalid or has expired. Please request a new one.',
                            '⚠️'
                        );
                    }
                }, 1000);
            }

            // Handle Password Update Form Submit
            if (form) {
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    if (isSubmitting) return;

                    const client = window.SupabaseConfig ? window.SupabaseConfig.getClient() : null;
                    if (!client) return;

                    const newPassword = newPassInput ? newPassInput.value : '';
                    const confirmPassword = confirmPassInput ? confirmPassInput.value : '';

                    if (!newPassword) {
                        showError('Please enter a new password.');
                        return;
                    }

                    if (!confirmPassword) {
                        showError('Please confirm your new password.');
                        return;
                    }

                    if (newPassword !== confirmPassword) {
                        showError('Passwords do not match.');
                        return;
                    }

                    const isValidStrength = evaluatePassword(newPassword);
                    if (!isValidStrength) {
                        showError('Password does not meet the required complexity requirements.');
                        return;
                    }

                    isSubmitting = true;
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Updating Password...';
                    }
                    if (errorBox) errorBox.style.display = 'none';

                    try {
                        const { data, error } = await client.auth.updateUser({
                            password: newPassword
                        });

                        if (error) throw error;

                        showSuccess(`
                            <strong>Admin password updated successfully. 🛡️</strong><br>
                            Your new password is now active.
                            <div style="margin-top: 18px;">
                                <a href="index.html" class="btn-primary" style="display: inline-flex; justify-content: center; width: 100%; text-decoration: none; padding: 10px;">Proceed to Admin Sign In</a>
                            </div>
                            <div style="font-size: 0.78rem; color: #818cf8; margin-top: 12px; font-weight: 600;" id="redirect-timer">Redirecting to Admin Sign In in 5s...</div>
                        `);

                        let timeLeft = 5;
                        const timerEl = document.getElementById('redirect-timer');
                        const interval = setInterval(() => {
                            timeLeft--;
                            if (timerEl) timerEl.textContent = `Redirecting to Admin Sign In in ${timeLeft}s...`;
                            if (timeLeft <= 0) {
                                clearInterval(interval);
                                window.location.href = 'index.html';
                            }
                        }, 1000);
                    } catch (err) {
                        console.error('Admin password reset error:', err);
                        let errMsg = err.message || 'Failed to update password. Your reset link may have expired.';
                        if (errMsg.toLowerCase().includes('same as password')) {
                            errMsg = 'New password must be different from your old password.';
                        }
                        showError(errMsg);
                    } finally {
                        isSubmitting = false;
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Update Admin Password';
                        }
                    }
                });
            }

            initRecovery();
        })();
    </script>
</body>
</html>
